        - "AWS (EKS/Lambda/S3/EC2) · GCP · Azure"
        - "Docker · Kubernetes · Terraform · CI/CD"
        - "FastAPI · Kafka · Spark · ONNX"
        - "Prometheus · Grafana · A/B Testing"

