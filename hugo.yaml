  # About
  about:
    enable: true
    title: "About Me"
    image: "/rohini.github.io/rohptf.jpg"
    content: |-
      I'm a Machine Learning / AI Engineer pursuing my Master's in Computational Data Science at the School of Computer Science, **Carnegie Mellon University** (GPA 3.99/4.00, graduating Dec 2026). I love taking ambiguous, complex problems all the way from research to production — designing the model, the serving stack, and the evaluation that proves it works.

      My recent work spans **agentic LLM systems** (multi-agent NL2SQL, MCP registries, Agent-to-Agent frameworks), **real-time recommendation systems** on streaming data, and **MLOps** — Dockerized serving, automated retraining, and A/B-tested rollouts. I've built these at **Qualcomm** and **Siemens**, and across CMU research. I'm especially drawn to applying ML in high-impact domains like healthcare.
    skills:
