  # projects
  projects:
    enable: true
    title: "Projects & Research"
    items:
      - title: NL2SQL Agent Benchmarking on Spider 2.0
        content: A multi-agent NL2SQL system evaluated against the Spider 2.0 benchmark and served via vLLM on SLURM. It integrates enriched semantic schema retrieval, explicit query planning, sub-agent execution, and SQL validation with self-correction loops — evaluated across GLM-4.7-Flash-AWQ, Gemini 3 Pro and GPT-5.5.
        image: /rohini.github.io/projects/nl2sql.svg
        badges:
          - "Multi-Agent"
          - "vLLM"
          - "SLURM"
          - "CMU Capstone"
        links:
          - icon: fab fa-github
            url: https://github.com/rohinidas18

      - title: Real-Time Movie Recommendation Platform
        content: A PyTorch matrix-factorization model trained on 236K users × 20K movies from live Kafka streams, with zero-downtime Dockerized dual-instance ONNX serving and automated retraining via GitHub Actions. A cost-aware reranker cut recommendation license cost by 93% ($6.01 → $0.42), validated with a full A/B framework (Welch's t-test, Mann-Whitney U).
        image: /rohini.github.io/projects/movie-rec.svg
        badges:
          - "PyTorch"
          - "Kafka"
          - "ONNX"
          - "MLOps"
        links:
          - icon: fab fa-github
            url: https://github.com/rohinidas18

      - title: Twitter Social Graph Recommendation Service
        content: A ranked user-recommendation REST microservice in Java Spring Boot sustaining 6000+ RPS at ~88% accuracy, backed by a Scala/Spark ETL pipeline over a 1.2TB Twitter dataset on GCP. Deployed with load balancing across self-managed Kubernetes, AWS EKS and ECS Fargate (Terraform IaC), fully automated via GitHub Actions.
        image: /rohini.github.io/projects/twitter-graph.svg
        badges:
          - "Spring Boot"
          - "Spark"
          - "Kubernetes"
          - "AWS"
        links:
          - icon: fab fa-github
            url: https://github.com/rohinidas18

      - title: "FedHealth: Federated ML for ICU Mortality Prediction"
        content: A privacy-preserving, decentralized mortality-prediction model using PyTorch and Flower.ai on ICU-EHR data from MIMIC-IV. Applied FedAvg and FedProx federated algorithms to achieve an F1 of ~0.94 and 95.3% accuracy, significantly outperforming a sequential ANN baseline (F1 0.82).
        image: /rohini.github.io/projects/fedhealth.svg
        badges:
          - "Federated Learning"
          - "PyTorch"
          - "Flower.ai"
          - "Healthcare"
        links:
          - icon: fab fa-github
            url: https://github.com/rohinidas18

      - title: Automated Face Detection & Recognition
        content: Led a 4-person team to build a face detection and recognition pipeline in TensorFlow/Keras using ResNet50 transfer learning on the AT&T Faces and FaceScrub datasets. Systematic hyperparameter tuning during segmentation reached 98.7% validation accuracy, integrated into the university's automated attendance system.
        image: /rohini.github.io/projects/face-detection.svg
        badges:
          - "ResNet50"
          - "TensorFlow"
          - "Computer Vision"
        links:
          - icon: fab fa-github
            url: https://github.com/rohinidas18

